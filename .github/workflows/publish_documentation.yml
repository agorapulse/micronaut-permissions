name: Manual Publish Documentation

on: workflow_dispatch

jobs:
  publish:
    name: Publish Documentation
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx6g -Xms4g"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17
      - name: Get Latest Release
        id: latest_version
        uses: abatilo/release-info-action@v1.3.0
        with:
          owner: agorapulse
          repo: micronaut-permissions
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish GitHub Pages
        # Was eskatos/gradle-command-action@v2 (archived, node16); `arguments:` moved to this run step.
        env:
          LATEST_TAG: ${{ steps.latest_version.outputs.latest_tag }}
          GRGIT_AUTH_USERNAME: ${{ secrets.AGORAPULSE_BOT_PERSONAL_TOKEN }}
        run: |
          ./gradlew -x groovydoc -x aggregateGroovydoc gitPublishPush \
            -Pversion="$LATEST_TAG" \
            -Prelease=true \
            -Dorg.ajoberstar.grgit.auth.username="$GRGIT_AUTH_USERNAME"
